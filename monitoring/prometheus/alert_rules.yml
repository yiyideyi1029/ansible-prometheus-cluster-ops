groups:
  - name: host_resource_alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "节点失联告警: {{ $labels.instance }}"
          description: "目标节点 {{ $labels.instance }} 已超过 1 分钟无法采集监控指标。"

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{fstype=~"ext4|xfs"} - node_filesystem_free_bytes{fstype=~"ext4|xfs"}) / node_filesystem_size_bytes{fstype=~"ext4|xfs"} * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "磁盘水位过高 (>85%): {{ $labels.instance }}"
          description: "挂载点 {{ $labels.mountpoint }} 当前使用率已超过 85%，请及时清理或触发自愈脚本。"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高 (>90%): {{ $labels.instance }}"