global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'linux_cluster_nodes'
    static_configs:
      - targets:
          - '192.168.10.11:9100'
          - '192.168.10.12:9100'
          - '192.168.10.21:9100'